name: Python CI Template

on:
  workflow_call:
    inputs:
      project-name:
        required: true
        type: string

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          path: source
          ref: ${{ github.sha }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Get template ref from source workflow
      - name: Get template ref
        id: template-ref
        working-directory: ./source
        run: |
          REF=$(sed -nE \
            's/^[[:space:]]*uses:.*@([^[:space:]]+).*$/\1/p' \
            .github/workflows/ci.yml | head -n 1)
          echo "Template ref: $REF"
          echo "template_ref=$REF" >> "$GITHUB_OUTPUT"
          
      - name: Install dependencies
        working-directory: ./source
        env:
          TEMPLATE_REF: ${{ steps.template-ref.outputs.template_ref }}
        run: |
          printenv
          # python -m pip install --upgrade pip
